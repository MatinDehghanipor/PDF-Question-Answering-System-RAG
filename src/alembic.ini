# Alembic configuration for the PDF QA system.
# URL is intentionally left blank per-alembic convention — env.py reads the
# real DATABASE_URL from app.core.config.settings (NFR-25).

[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url is set dynamically in alembic/env.py from app settings.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S